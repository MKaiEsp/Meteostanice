<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meteostanice</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f9f9f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meteostanice">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { color-scheme: light dark; --bg:#f9f9f7; --card:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --line:rgba(11,11,11,.14); --accent:#2a78d6; --err:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d0d0d; --card:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --line:rgba(255,255,255,.16); --accent:#3987e5; --err:#ff8a80; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:16px;
    background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.4; }
  .card { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px 20px; text-align:center; }
  .card img { width:72px; height:72px; border-radius:16px; display:block; margin:0 auto 12px; }
  h1 { font-size:20px; margin:0 0 4px; font-weight:600; }
  p.sub { margin:0 0 16px; font-size:14px; color:var(--ink2); }
  input[type=password] { width:100%; height:48px; padding:0 14px; font-size:16px; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; }
  input[type=password]:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button { width:100%; height:48px; margin-top:12px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:16px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  label.rem { display:flex; align-items:center; justify-content:center; gap:8px; margin-top:12px; font-size:14px; color:var(--ink2); }
  label.rem input { width:18px; height:18px; }
  #msg { min-height:20px; margin:10px 0 0; font-size:14px; color:var(--err); }
  .hid { position:absolute; left:-9999px; width:1px; height:1px; opacity:0; }
</style>
</head>
<body>
<main class="card">
  <img src="icon-192.png" alt="">
  <h1>Meteostanice</h1>
  <p class="sub" id="sub">Stránka je chráněná heslem.</p>
  <form id="f" autocomplete="on" hidden>
    <input class="hid" type="text" name="username" value="meteostanice" autocomplete="username" tabindex="-1" aria-hidden="true" readonly>
    <input type="password" id="pw" name="password" placeholder="Heslo" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <label class="rem"><input type="checkbox" id="rem" checked> Pamatovat si na tomto zařízení</label>
    <button type="submit" id="go">Odemknout</button>
  </form>
  <p id="msg" role="alert" aria-live="polite"></p>
  <noscript><p>Pro zobrazení je potřeba zapnout JavaScript.</p></noscript>
</main>

  const $ = (id) => document.getElementById(id);
  const KEY = 'ms.unlock';
  const b2u = (b) => Uint8Array.from(atob(b), (c) => c.charCodeAt(0));
  const u2b = (u) => { let s = ''; u.forEach((x) => { s += String.fromCharCode(x); }); return btoa(s); };
  const norm = (s) => s.toLowerCase().replace(/[\s-]+/g, '');
  const store = {
    get() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } },
    set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) { /* nevadí */ } },
    del() { try { localStorage.removeItem(KEY); } catch (e) { /* nevadí */ } }
  };

  async function deriveKey(pass) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(pass)), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b2u(P.salt), iterations: P.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  async function decryptWith(key) {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b2u(P.iv) }, key, b2u(P.ct));
    return new TextDecoder().decode(pt);
  }
  async function showApp(html) {
    // document.write smí přepsat stránku až po jejím úplném načtení, jinak se obsah jen připojí za přihlašovací stránku
    if (document.readyState !== 'complete') await new Promise((r) => window.addEventListener('load', r, { once: true }));
    await new Promise((r) => setTimeout(r, 0));
    document.open(); document.write(html); document.close();
  }
  function showForm(text) {
    $('sub').textContent = 'Stránka je chráněná heslem.';
    $('f').hidden = false;
    if (text) $('msg').textContent = text;
    $('pw').focus();
  }

  async function auto() {
    const saved = store.get();
    if (!saved || saved.salt !== P.salt || !saved.key) return false;
    try {
      const key = await crypto.subtle.importKey('raw', b2u(saved.key), 'AES-GCM', false, ['decrypt']);
      const html = await decryptWith(key);
      await showApp(html);
      return true;
    } catch (e) {
      store.del();
      return false;
    }
  }

  async function start() {
    if (!window.crypto || !crypto.subtle) {
      $('sub').textContent = '';
      $('msg').textContent = 'Tento prohlížeč nebo adresa nepodporuje odemknutí. Stránka musí běžet přes HTTPS.';
      return;
    }
    $('sub').textContent = 'Odemykám…';
    if (await auto()) return;
    showForm('');

    $('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pass = $('pw').value;
      if (!pass) return;
      $('go').disabled = true;
      $('msg').textContent = '';
      $('go').textContent = 'Odemykám…';
      try {
        const key = await deriveKey(pass);
        const html = await decryptWith(key);
        if ($('rem').checked) {
          const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
          store.set({ salt: P.salt, key: u2b(raw) });
        } else {
          store.del();
        }
        await showApp(html);
      } catch (err) {
        $('msg').textContent = 'Špatné heslo, zkus to znovu.';
        $('go').disabled = false;
        $('go').textContent = 'Odemknout';
        $('pw').select();
      }
    });
  }
  start();
})();
</script>
